version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.4.0
  incremental-test: {}

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

workflows:
  test-deploy:
    jobs:
      - incremental-test/commit-diff-test:
          name: integration-test-dry-run
          context: tenzai-orb-testing
          dry-run: true
          filters: *filters
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: tenzai/incremental-test
          vcs_type: github
          pub_type: production
          enable_pr_comment: false
          context: orb-publishing
          requires:
            - integration-test-dry-run
            - orb-tools/pack
          filters: *release-filters
