version: 2.1
setup: true

orbs:
  orb-tools: circleci/orb-tools@12.4.0

filters: &filters
  tags:
    only: /.*/

jobs:
  unit-tests:
    docker:
      - image: cimg/node:24.15.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci --ignore-scripts
      - run:
          name: Check runtime and source
          command: npm run check

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: incremental-test
          filters: *filters
      - unit-tests:
          filters: *filters
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: github
          orb_name: incremental-test
          requires:
            - orb-tools/lint
            - orb-tools/pack
            - orb-tools/review
            - unit-tests
          filters: *filters
