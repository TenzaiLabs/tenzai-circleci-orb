description: Install a pinned Tenzai CLI release on a Linux executor.

parameters:
  version:
    type: string
    default: "0.2.0"
    description: Tenzai CLI release version.
  install-dir:
    type: string
    default: ""
    description: Installation directory. Defaults to $HOME/.local/bin.

steps:
  - run:
      name: Install Tenzai CLI
      environment:
        TENZAI_ORB_CLI_VERSION: << parameters.version >>
        TENZAI_ORB_INSTALL_DIR: << parameters.install-dir >>
      command: <<include(scripts/install.sh)>>
