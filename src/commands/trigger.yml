description: >
  Trigger a fire-and-forget Tenzai incremental test. The executor must provide
  Node.js 24 or newer.

parameters:
  access-key-variable:
    type: env_var_name
    default: TENZAI_ACCESS_KEY
    description: Environment variable containing the Tenzai service-account access key.
  app-id:
    type: string
    default: ""
    description: Existing Tenzai application ID. Takes precedence over app-id-variable.
  app-id-variable:
    type: env_var_name
    default: TENZAI_APP_ID
    description: Environment variable containing the existing Tenzai application ID.
  base-url:
    type: string
    default: https://api.tenzai.io
    description: Tenzai platform API base URL.
  circleci-token-variable:
    type: env_var_name
    default: CIRCLECI_TOKEN
    description: Environment variable containing a CircleCI personal API token.
  from-commit:
    type: string
    default: ""
    description: Explicit base commit. When set, CircleCI history discovery is skipped.
  to-commit:
    type: string
    default: ""
    description: Explicit target commit. Defaults to the current CircleCI revision.
  repository:
    type: string
    default: ""
    description: Repository in owner/repo form. Defaults to the current CircleCI project.
  history-branch:
    type: string
    default: ""
    description: Optional branch filter for automatic workflow history discovery.
  dry-run:
    type: boolean
    default: false
    description: Validate Tenzai authentication and application access without triggering a test.
  ignore-errors:
    type: boolean
    default: false
    description: Report errors without failing the CircleCI step.

steps:
  - run:
      name: Trigger Tenzai incremental test
      shell: /usr/bin/env node
      environment:
        TENZAI_ORB_ACCESS_KEY_VARIABLE: << parameters.access-key-variable >>
        TENZAI_ORB_APP_ID: << parameters.app-id >>
        TENZAI_ORB_APP_ID_VARIABLE: << parameters.app-id-variable >>
        TENZAI_ORB_BASE_URL: << parameters.base-url >>
        TENZAI_ORB_CIRCLECI_TOKEN_VARIABLE: << parameters.circleci-token-variable >>
        TENZAI_ORB_FROM_COMMIT: << parameters.from-commit >>
        TENZAI_ORB_TO_COMMIT: << parameters.to-commit >>
        TENZAI_ORB_REPOSITORY: << parameters.repository >>
        TENZAI_ORB_HISTORY_BRANCH: << parameters.history-branch >>
        TENZAI_ORB_DRY_RUN: orb-boolean-<< parameters.dry-run >>
        TENZAI_ORB_IGNORE_ERRORS: orb-boolean-<< parameters.ignore-errors >>
      command: <<include(scripts/trigger.js)>>
